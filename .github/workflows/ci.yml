name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (driver + service + api)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go toolchain for the optional management API (rbapi.exe).
      # The C<->Go contract verification also needs it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # Install WDK - windows-2022 usually has it pre-installed
      # If not, we use a fallback approach
      - name: Verify/Install WDK
        shell: cmd
        run: |
          echo Checking for Windows Driver Kit installation...
          if exist "C:\Program Files (x86)\Windows Kits\10\Include" (
            echo Windows Kits 10 Include found
            dir "C:\Program Files (x86)\Windows Kits\10\Include"
          ) else if exist "C:\Program Files\Windows Kits\10\Include" (
            echo Windows Kits 10 Include found
            dir "C:\Program Files\Windows Kits\10\Include"
          ) else (
            echo Windows Kits not found - attempting winget install
            C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe install -e --id Microsoft.WindowsDriverKit --accept-source-agreements --accept-package-agreements || echo Winget install attempt completed
          )

      # Fast-fail check that the SDK + WDK layout driver\build.cmd expects
      # is actually present. This catches missing ucrt / um / shared headers
      # in the runner's SDK before a 10-minute build trip fails.
      - name: Verify SDK+WDK layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path $kitsRoot)) { $kitsRoot = "C:\Program Files\Windows Kits\10" }
          
          Write-Host "Looking for SDK in: $kitsRoot"
          if (-not (Test-Path "$kitsRoot\Include")) {
            throw "Windows Kits Include directory not found at $kitsRoot"
          }
          
          $ver = Get-ChildItem "$kitsRoot\Include" -Directory |
                 Sort-Object { [Version]($_.Name -replace '^\D+', '0.0') } |
                 Select-Object -Last 1 -ExpandProperty Name
          if (-not $ver) { throw "no SDK include tree under $kitsRoot" }
          
          Write-Host "Found SDK version: $ver"
          $must = @(
            "$kitsRoot\Include\$ver\ucrt",
            "$kitsRoot\Include\$ver\shared",
            "$kitsRoot\Include\$ver\um",
            "$kitsRoot\Include\$ver\km",
            "$kitsRoot\Lib\$ver\ucrt\x64",
            "$kitsRoot\Lib\$ver\km\x64\fltMgr.lib"
          )
          foreach ($p in $must) {
            if (-not (Test-Path $p)) { 
              Write-Host "Missing: $p"
              throw "missing: $p" 
            }
            Write-Host "OK: $p"
          }
          Write-Host "SDK+WDK layout OK at $ver"

      # Full build: driver (.sys) + core service (.exe) + Go API (.exe) +
      # contract verification. No signing in CI (no cert) -> use "nosign".
      - name: Run build_all
        shell: cmd
        run: build_all.cmd Release nosign

      # Lightweight smoke test of the built artifacts. Verifies:
      #   - Artifacts exist and are valid PE executables
      #   - Go API can run (prints version)
      #   - Driver is a valid PE32+ (x64) NATIVE image
      # Note: C service (rbservice.exe) requires Windows service registration,
      # so we only verify it's a valid PE, not run it as a console app.
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'target\Release'
          $sys = Join-Path $bin 'rbminiflt.sys'
          $srv = Join-Path $bin 'rbservice.exe'
          $api = Join-Path $bin 'rbapi.exe'

          function Test-PeFile {
            param([string]$path)
            if (-not (Test-Path $path)) { throw "missing artifact: $path" }
            $b = [System.IO.File]::ReadAllBytes($path)
            if ($b.Length -lt 0x40) { throw "$path too small to be a PE" }
            
            $header = [System.Text.Encoding]::ASCII.GetString($b, 0, 2)
            if ($header -ne 'MZ') { 
              throw "$path : DOS header missing, got: $header"
            }
            
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            if ($peOff -lt 0x40 -or $peOff -gt $b.Length - 4) {
              throw "$path : invalid PE offset"
            }
            
            $sig = [System.Text.Encoding]::ASCII.GetString($b, $peOff, 2)
            if ($sig -ne 'PE') {
              throw "$path : PE signature missing, got: $sig"
            }
            
            Write-Host "OK : $path is a valid PE"
          }

          function Test-PeNative {
            param([string]$path)
            Test-PeFile $path
            
            $b = [System.IO.File]::ReadAllBytes($path)
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            
            $magic = [BitConverter]::ToUInt16($b, $peOff + 24)
            if ($magic -ne 0x20B) { 
              throw "$path : not PE32+ (magic 0x$($magic.ToString('X4')))"
            }
            
            $subsys = [BitConverter]::ToUInt16($b, $peOff + 24 + 68)
            if ($subsys -ne 1) { 
              throw "$path : subsystem $subsys, expected NATIVE (1)"
            }
            
            Write-Host "OK : $path is a valid x64 NATIVE PE"
          }

          # 1) Verify C service is a valid PE (cannot run as console app - requires service)
          Test-PeFile $srv

          # 2) Go API - test by running it
          Write-Host "Testing Go API..."
          $p = Start-Process -FilePath $api -ArgumentList '-version' `
                -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\api.out"
          if ($p.ExitCode -ne 0) {
            $msg = if (Test-Path "$env:RUNNER_TEMP\api.out") { Get-Content "$env:RUNNER_TEMP\api.out" -Raw } else { 'no output' }
            throw "$api -version exited with code $($p.ExitCode): $msg"
          }
          $output = Get-Content "$env:RUNNER_TEMP\api.out" -Raw
          Write-Host "API output: $output"

          # 3) Driver PE sanity: MZ + PE32+ (x64) + NATIVE subsystem
          Test-PeNative $sys

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: target/Release/
          if-no-files-found: warn
          retention-days: 7