name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (driver + service + api)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go toolchain for the optional management API (rbapi.exe).
      # The C<->Go contract verification also needs it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # windows-2022 ships Visual Studio 2022 Enterprise with the
      # "Desktop development with C++" workload and a Windows 11 SDK, so the
      # MSVC toolset and the user-mode SDK (ucrt/um/shared headers, ucrt.lib)
      # are already present. We only need the WDK kernel-mode pieces (km
      # headers, fltMgr.lib, ...), which Microsoft now ships as a NuGet
      # package (Microsoft.Windows.WDK.x64). This avoids the Winget / App
      # Installer / MSIX dependency chain that is not preinstalled on
      # windows-2022 and has been tripping up VSIX-based installs.
      - name: Install WDK via NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '10.0.28000.2526'
          $pkg = 'Microsoft.Windows.WDK.x64'
          $nupkg = "$env:RUNNER_TEMP\wdk-$ver.nupkg"
          $url = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLower())/$ver/$($pkg.ToLower()).$ver.nupkg"

          Write-Host "Downloading $pkg $ver ..."
          Invoke-WebRequest -Uri $url -OutFile $nupkg

          # The WDK nupkg is just a zip. Extract it and lay its content
          # directly under the Windows Kits 10 SDK root that the runner
          # already ships, so driver\build.cmd's auto-detection still works.
          # We pick the highest installed SDK version on the runner and merge
          # the WDK pieces (km include + km Lib\x64) into it. ucrt/um/shared
          # stay from the SDK.
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path $kitsRoot)) { $kitsRoot = "C:\Program Files\Windows Kits\10" }
          $sdkVer = Get-ChildItem "$kitsRoot\Include" -Directory |
                    # Sort by numeric [Version] so "10.0.28000.x" beats "wdf",
                    # "ntdll" etc. (string sort would pick "wdf" first since
                    # 'w' > '1' lexicographically).
                    Sort-Object { [Version]($_.Name -replace '^\D+', '0.0') } |
                    Select-Object -Last 1 -ExpandProperty Name
          if (-not $sdkVer) {
            throw "No Windows 10 SDK installed under $kitsRoot\Include"
          }
          Write-Host "Runner SDK version: $sdkVer (merging WDK pieces into it)"

          $extract = "$env:RUNNER_TEMP\wdk-extract"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          # .nupkg is a zip, but Expand-Archive rejects non-.zip extensions,
          # so use System.IO.Compression.ZipFile directly.
          Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $extract)

          # NuGet layout:
          #   <extract>\c\Include\10.0.28000.0\km\...   (kernel-mode headers)
          #   <extract>\c\Lib\10.0.28000.0\km\x64\...   (kernel-mode libs)
          $srcInc = "$extract\c\Include\10.0.28000.0\km"
          $srcLib = "$extract\c\Lib\10.0.28000.0\km\x64"
          if (-not (Test-Path $srcInc) -or -not (Test-Path $srcLib)) {
            throw "WDK nupkg layout unexpected: $srcInc or $srcLib missing"
          }

          $dstInc = "$kitsRoot\Include\$sdkVer\km"
          $dstLib = "$kitsRoot\Lib\$sdkVer\km\x64"
          New-Item -ItemType Directory -Force -Path $dstInc | Out-Null
          New-Item -ItemType Directory -Force -Path $dstLib | Out-Null
          # robocopy returns 0..7 for success, 8+ for failure; tolerate up to 7.
          $r1 = robocopy $srcInc $dstInc /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
          $r2 = robocopy $srcLib $dstLib /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($r1 -ge 8) { throw "robocopy include failed: $r1" }
          if ($r2 -ge 8) { throw "robocopy lib failed: $r2" }

          # Sanity check: fltMgr.lib must now be present (it's the telltale
          # that the km Lib\x64 tree actually got populated).
          if (-not (Test-Path "$dstLib\fltMgr.lib")) {
            throw "fltMgr.lib missing under $dstLib after copy"
          }
          Write-Host "WDK km headers/libs merged into $dstInc / $dstLib"

      # Fast-fail check that the SDK + WDK layout driver\build.cmd expects
      # is actually present after the merge above. This catches missing ucrt
      # / um / shared headers in the runner's SDK before a 10-minute build
      # trip fails for an unrelated-looking reason.
      - name: Verify SDK+WDK layout
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path $kitsRoot)) { $kitsRoot = "C:\Program Files\Windows Kits\10" }
          $ver = Get-ChildItem "$kitsRoot\Include" -Directory |
                 Sort-Object { [Version]($_.Name -replace '^\D+', '0.0') } |
                 Select-Object -Last 1 -ExpandProperty Name
          if (-not $ver) { throw "no SDK include tree under $kitsRoot" }
          $must = @(
            "$kitsRoot\Include\$ver\ucrt",
            "$kitsRoot\Include\$ver\shared",
            "$kitsRoot\Include\$ver\um",
            "$kitsRoot\Include\$ver\km",
            "$kitsRoot\Lib\$ver\ucrt\x64",
            "$kitsRoot\Lib\$ver\km\x64\fltMgr.lib"
          )
          foreach ($p in $must) {
            if (-not (Test-Path $p)) { throw "missing: $p" }
          }
          Write-Host "SDK+WDK layout OK at $ver"

      # Full build: driver (.sys) + core service (.exe) + Go API (.exe) +
      # contract verification. No signing in CI (no cert) -> use "nosign".
      - name: Run build_all
        shell: cmd
        run: build_all.cmd Release nosign

      # Lightweight smoke test of the built artifacts. None of these need the
      # kernel driver or a registered service, so they run fine on the runner:
      #   - C service prints usage (executable + CRT load)
      #   - C service opens/creates the DB, applies schema, runs the rebuild
      #     path against an empty store (sqlite link + schema init)
      #   - Go API prints its version (Go runtime + build link)
      #   - driver is a valid PE32+ (x64) NATIVE image
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'target\Release'
          $sys = Join-Path $bin 'rbminiflt.sys'
          $srv = Join-Path $bin 'rbservice.exe'
          $api = Join-Path $bin 'rbapi.exe'

          function Assert-Exe {
            param([string]$path, [string]$args)
            if (-not (Test-Path $path)) { throw "missing artifact: $path" }
            $errLog = "$env:RUNNER_TEMP\smoke.err"
            $p = Start-Process -FilePath $path -ArgumentList $args `
                  -NoNewWindow -Wait -PassThru -RedirectStandardError $errLog
            if ($p.ExitCode -ne 0) {
              $msg = if (Test-Path $errLog) { Get-Content $errLog -Raw } else { '' }
              throw "$path $args exited $($p.ExitCode): $msg"
            }
            Write-Host "OK : $path $args"
          }

          # 1) C service self-check: usage, no driver required.
          Assert-Exe $srv '--help'

          # 2) C service DB round-trip: create schema + run rebuild on empty store.
          $tmp = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke" |
                 Select-Object -ExpandProperty FullName
          Assert-Exe $srv "rebuild-i --db $tmp\smoke.db"

          # 3) Go API self-check: version banner.
          Assert-Exe $api '-version'

          # 4) Driver PE sanity: MZ + PE32+ (x64) + NATIVE subsystem.
          if (-not (Test-Path $sys)) { throw "missing artifact: $sys" }
          $b = [System.IO.File]::ReadAllBytes($sys)
          if ($b.Length -lt 0x40) { throw "$sys too small to be a PE" }
          if ([System.Text.Encoding]::ASCII.GetString($b, 0, 2) -ne 'MZ') {
            throw "$sys: DOS header 'MZ' missing"
          }
          $peOff = [BitConverter]::ToInt32($b, 0x3C)
          if ([System.Text.Encoding]::ASCII.GetString($b, $peOff, 4) -ne "PE$([char]0)$([char]0)") {
            throw "$sys: PE signature missing"
          }
          $magic = [BitConverter]::ToUInt16($b, $peOff + 24)
          if ($magic -ne 0x20B) { throw "$sys: not PE32+ (magic 0x$($magic.ToString('X4')))" }
          $subsys = [BitConverter]::ToUInt16($b, $peOff + 24 + 68)
          if ($subsys -ne 1) { throw "$sys: subsystem $subsys, expected NATIVE (1)" }
          Write-Host "OK : $sys is a valid x64 NATIVE PE image"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: target/Release/
          if-no-files-found: warn
          retention-days: 7
